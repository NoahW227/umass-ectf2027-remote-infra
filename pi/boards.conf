# eCTF remote board map
# One line per board:  name  serial_port  nrst_gpio  pb21_gpio  gdb_port
#
# - serial_port: the /dev/serial/by-path/ link of the XDS110 UART (interface
#   ":1.0"). NOT by-id: our XDS110s all report serial M4321005, so their by-id
#   links collide. by-path follows the physical hub port -> don't move cables.
#   Find them with: ls -l /dev/serial/by-path/ | grep -v usbv2
# - GPIOs are BCM numbers. Wire each to the board's NRST / PB21 header pins,
#   and connect a Pi GND pin to the board's GND.
#
# Suggested Pi pins (BCM -> physical header pin):
#   board1: 17 (pin 11), 27 (pin 13)    board2: 22 (pin 15), 23 (pin 16)
#   board3: 24 (pin 18), 25 (pin 22)    board4:  5 (pin 29),  6 (pin 31)
#   GND: pins 6, 9, 14, 20, 25, 30, 34, 39
# - gdb_port: OpenOCD GDB server port for "ectf.sh <board> debug" (localhost only)

board1  /dev/serial/by-path/platform-3f980000.usb-usb-0:1.3.4:1.0  17  27  3333   # insecure bootloader 26.0.1, UMass fw
board2  /dev/serial/by-path/platform-3f980000.usb-usb-0:1.3.2:1.0  22  23  3334   # insecure bootloader 26.0.2 (new 2026-10-21)
#board3 /dev/serial/by-id/usb-Texas_Instruments_XDS110_SERIAL3-if00  24  25  3335
#board4 /dev/serial/by-id/usb-Texas_Instruments_XDS110_SERIAL4-if00   5   6  3336
