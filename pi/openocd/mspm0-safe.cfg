# MSPM0L2228 target for the shared board Pi: debug-only.
#
# Derived from OpenOCD's target/ti_mspm0.cfg (TI, GPL-2.0-or-later) with every
# destructive path removed, because flash/NONMAIN mistakes can be permanent:
#   - no `flash bank`s: no GDB `load`, `flash erase/write`, `program`, and no
#     way to touch NONMAIN (BCR/BSL config) through OpenOCD's flash driver
#   - no mspm0_factory_reset / mspm0_mass_erase / mspm0_start_bootloader (DSSM)
#   - no telnet/tcl command ports; GDB only, bound to localhost (SSH tunnel)
# Flashing stays on the eCTF bootloader (ectf.sh flash).
#
# This blocks accidents, not intent: GDB `monitor mww` to FLASHCTL or raw
# `dap apreg` DSSM writes could still do damage. Don't.

transport select swd
source [find target/swj-dp.tcl]

set _CHIPNAME mspm0x
swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id 0x2ba01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

# Debug access needs the power AP forced active if flash is empty or the
# core is in low power (from ti_mspm0.cfg).
proc _mspm0_enable_low_power_mode { } {
	$::_CHIPNAME.dap apreg 4 0x00 0x104008
	$::_CHIPNAME.dap apreg 4 0xF0 0x01
	$::_CHIPNAME.dap apreg 4 0x00 0x100008
}
$_TARGETNAME configure -event examine-start { _mspm0_enable_low_power_mode }
$_TARGETNAME configure -work-area-phys 0x20200000 -work-area-size 0x400 -work-area-backup 1

cortex_m reset_config sysresetreq
adapter speed 2500

# Closing GDB must never leave a shared board frozen: resume on detach.
$_TARGETNAME configure -event gdb-detach { resume }

# No flash banks -> GDB sees flash as RAM and would patch BKPT into it; force
# hardware breakpoints instead (Cortex-M0+: 4 breakpoints, 2 watchpoints).
gdb breakpoint_override hard
gdb flash_program disable
telnet port disabled
tcl port disabled
